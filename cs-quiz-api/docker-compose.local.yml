# Local Docker hot-reload: Postgres + Go Air API + Vite WebUI (bind mounts).
# Usage: docker compose -f docker-compose.local.yml -p cs-quiz up -d --force-recreate
name: cs-quiz
services:
  postgres:
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_USER: csquiz
      POSTGRES_PASSWORD: csquiz
      POSTGRES_DB: csquiz
    ports:
      - "5435:5432"
    volumes:
      - cs-quiz-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U csquiz -d csquiz"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: golang:1.23-alpine
    restart: "no"
    working_dir: /app
    environment:
      ADDR: "0.0.0.0:8090"
      DATABASE_URL: postgres://csquiz:csquiz@postgres:5432/csquiz?sslmode=disable
      JWT_SECRET: change-me-in-production
      INVITE_CODE: csquiz
      ADMIN_EMAIL: armin@local
      UPLOAD_DIR: uploads
      MIGRATIONS_DIR: migrations
      GIN_MODE: debug
      GOTOOLCHAIN: auto
    command:
      - sh
      - -c
      - apk add --no-cache git gcc musl-dev && go install github.com/air-verse/air@v1.61.7 && air -c .air.toml
    volumes:
      - .:/app
      - cs-quiz-gomod:/go/pkg/mod
      - cs-quiz-gotmp:/app/tmp
      - cs-quiz-uploads:/app/uploads
    ports:
      - "8175:8090"
    depends_on:
      postgres:
        condition: service_healthy

  webui:
    image: node:22-alpine
    restart: "no"
    working_dir: /app
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_BASE_PATH: "/cs-quiz/"
      VITE_HMR_CLIENT_PORT: "80"
      WATCHPACK_POLLING: "true"
      VITE_API_PROXY: http://api:8090
    command:
      - sh
      - -c
      - rm -rf /app/node_modules/* /app/node_modules/.[!.]* 2>/dev/null; npm install && npm run dev -- --host 0.0.0.0 --port 5173 --strictPort
    volumes:
      - ../cs-quiz-webui:/app
      - cs-quiz-webui-node-modules:/app/node_modules
    ports:
      - "5175:5173"
    networks:
      - default
      - pc-armin-local
    depends_on:
      - api

volumes:
  cs-quiz-postgres-data:
  cs-quiz-gomod:
  cs-quiz-gotmp:
  cs-quiz-uploads:
  cs-quiz-webui-node-modules:

networks:
  pc-armin-local:
    external: true
