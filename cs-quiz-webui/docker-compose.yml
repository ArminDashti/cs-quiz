name: cs-quiz
services:
  cs-quiz-webui:
    image: ${IMAGE_TAG:-cs-quiz-webui:latest}
    container_name: cs-quiz-webui
    expose:
      - "${INTERNAL_PORT:-80}"
    ports:
      - target: ${INTERNAL_PORT:-80}
        published: ${PUBLISH_PORT:-5175}
        protocol: tcp
    environment:
      API_HOST: ${API_HOST:-cs-quiz-api}
      API_PORT: ${API_PORT:-8090}
    networks:
      - t3-net
    restart: "no"

networks:
  t3-net:
    name: ${DOCKER_NETWORK:-t3-net}
    external: true